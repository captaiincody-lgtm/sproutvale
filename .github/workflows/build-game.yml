# Builds ready-to-run copies of the game every time something is merged
# into main, and puts them on the "Latest build" release page:
#   https://github.com/captaiincody-lgtm/sproutvale/releases/latest
# It can also be started by hand from the Actions tab ("Run workflow").
name: Build game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-game-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-windows

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates
          cd ~/godot-cache
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o tpl.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the templates this project exports with, to keep the cache small.
          unzip -ojq tpl.tpz templates/version.txt templates/macos.zip \
            templates/windows_release_x86_64.exe -d templates
          rm tpl.tpz

      - name: Install Godot
        run: |
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          cp ~/godot-cache/templates/* "$T/"
          sudo install -m 755 ~/godot-cache/godot /usr/local/bin/godot
          godot --headless --version

      - name: Import project
        working-directory: godot
        run: godot --headless --import

      - name: Export macOS and Windows builds
        working-directory: godot
        run: |
          mkdir -p export/macos export/windows dist
          godot --headless --export-release "macOS" export/macos/Sproutvale.zip
          godot --headless --export-release "Windows Desktop" export/windows/Sproutvale.exe
          cp export/macos/Sproutvale.zip dist/Sproutvale-macOS.zip
          cp export/windows/Sproutvale.exe dist/Sproutvale-Windows.exe

      - name: Check the Mac app is complete
        working-directory: godot
        # The Mac app is "damaged or incomplete" if the game program or its
        # run permission goes missing, so fail the build if either happens.
        run: |
          python3 - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile("dist/Sproutvale-macOS.zip")
          names = {i.filename: i for i in z.infolist()}
          exe = names.get("Sproutvale.app/Contents/MacOS/Sproutvale")
          pck = names.get("Sproutvale.app/Contents/Resources/Sproutvale.pck")
          sig = names.get("Sproutvale.app/Contents/_CodeSignature/CodeResources")
          ok = True
          if exe is None or exe.file_size == 0:
              print("::error::Mac game program is missing"); ok = False
          elif not (exe.external_attr >> 16) & 0o111:
              print("::error::Mac game program is not marked as runnable"); ok = False
          if pck is None or pck.file_size == 0:
              print("::error::Game data (Sproutvale.pck) is missing"); ok = False
          if sig is None:
              print("::error::Mac app is not signed"); ok = False
          if ok:
              print(f"Mac app OK: program {exe.file_size} bytes, mode {oct(exe.external_attr >> 16)}; data {pck.file_size} bytes")
          sys.exit(0 if ok else 1)
          PY

      - name: Publish the "Latest build" release
        if: github.event_name != 'pull_request'
        working-directory: godot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/Sproutvale-macOS.zip dist/Sproutvale-Windows.exe \
            --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          **Mac:** download Sproutvale-macOS.zip, double-click it to unzip, then right-click Sproutvale.app and choose Open the first time.
          **Windows:** download Sproutvale-Windows.exe and run it."
